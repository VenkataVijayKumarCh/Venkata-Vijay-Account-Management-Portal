name: .NET Build & Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore ./VASP/VenkataAllocationManagementSystem.sln

    - name: Build
      run: dotnet build ./VASP/VenkataAllocationManagementSystem.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test ./VASP/VenkataAllocationManagementSystem.sln --no-build --verbosity normal
